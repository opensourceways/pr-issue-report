# email_controls.yaml
# 邮件接收偏好控制文件
#
# 说明：
# - 不在本文件中的用户，默认接收所有邮件和所有角色部分。
# - 每个字段为布尔值：true 表示接收，false 表示不接收。
# - 可以只声明需要关闭的部分，未声明的默认按 true 处理。
#
# 支持简化写法：
#   username:
#     pr: false          # 关闭整个 PR 邮件
#   username:
#     issue: false       # 关闭整个 Issue 邮件
#   username:
#     all: false         # 完全退订所有邮件
#
# 完整写法示例：
#   username:
#     pr:
#       maintainer: false
#       committer: true
#     issue:
#       maintainer: true
#       committer: true
#
# 按社区覆盖（可选，社区名见 communities.yaml）：
#   username:
#     issue: false       # 基础配置：对所有社区生效
#     communities:
#       boostkit:
#         all: false     # boostkit 社区完全退订；
#                        # 该社区的配置整体覆盖基础配置，未声明的部分默认接收

# 示例用户（请根据实际退订需求修改）
# zhangsan:
#   pr:
#     maintainer: false
#     committer: true
#   issue:
#     maintainer: true
#     committer: true

# lisi:
#   issue: false

# wangwu:
#   all: false

# huyuhan9@huawei.com (sig-intelligence committer)：完全退订所有汇总邮件
binaryzero-hyh:
  all: false

# subin19@huawei.com (sig-HPC committer)：完全退订所有汇总邮件
subin19:
  all: false

# hongxuming@huawei.com (sig-CloudNative committer)：完全退订所有汇总邮件
hong-xuming:
  all: false
