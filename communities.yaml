# Per-community configuration for the weekly PR/Issue report.
# The active community is selected by the COMMUNITY env var (default: openeuler).

openeuler:
  display_name: openEuler
  community_repo: https://gitcode.com/openeuler/community.git
  orgs: [openeuler, src-openeuler]
  repo_source: dir_walk            # 遍历 sig/<Sig>/<org>/**/*.yaml 发现仓库
  data_source: ipb                 # 聚合接口 ipb.osinfra.cn
  cla_label: openeuler-cla/yes
  ci_failed_label: ci_failed
  wait_update_label: kind/wait_for_update
  processed_rate: dsapi            # dsapi.osinfra.cn 支持周对比
  skip_sigs: [Kernel]              # Kernel SIG 由 hulk_robot_test 独立处理
  mail_subject_pr: openEuler 待处理PR汇总
  mail_body_pr: 以下是您参与openEuler社区的待处理PR汇总，不同部分代表您在不同角色下需要关注的PR。
  mail_subject_issue: openEuler 待处理Issue汇总
  mail_body_issue: 以下是您参与openEuler社区的待处理Issue汇总，不同部分代表您在不同角色下需要关注的Issue。

boostkit:
  display_name: BoostKit
  community_repo: https://gitcode.com/boostkit/community.git
  orgs: [boostkit]
  repo_source: sig_info            # 目录分片 yaml 滞后于 sig-info.yaml，以 sig-info.yaml 为准
  data_source: gitcode_api         # 逐仓库调 GitCode API，需要 GITCODE_TOKEN
  cla_label: boostkit-cla/yes
  ci_failed_label: ''              # BoostKit CI 失败标签未知，暂不检测
  wait_update_label: kind/wait_for_update
  processed_rate: none             # dsapi 不支持 boostkit，跳过周对比
  skip_sigs: []
  mail_subject_pr: BoostKit 待处理PR汇总
  mail_body_pr: 以下是您参与BoostKit社区的待处理PR汇总，不同部分代表您在不同角色下需要关注的PR。
  mail_subject_issue: BoostKit 待处理Issue汇总
  mail_body_issue: 以下是您参与BoostKit社区的待处理Issue汇总，不同部分代表您在不同角色下需要关注的Issue。
  # 资料相关汇总：社区级邮件（不按 reviewer 分发），发给资料相关的固定收件人名单，
  # 由独立流水线 docs_statistics.py 处理（见 jenkins_job_boostkit_docs.sh）。
  docs_report:
    enabled: true
    workdir: boostkit-docs        # 独立运行目录，可与 boostkit/ 的周报并行跑互不干扰
    # 资料口径。注意：docs-ci-pipeline-* 是仓库级 CI 状态标签（配了资料流水线的仓库里
    # 所有 PR 都会带），不是内容信号，绝不能用它过滤。
    pr_labels: [need-doc-sig-review, doc-sig-reviewed, sig/doc, sig/Doc, ai-docs-only]
    # PR 报表额外加一列展示资料标签状态，让收件人一眼看出哪些还需要处理
    # （按下面的顺序匹配，命中第一个即用；未命中任何标签的留空）
    status_header: 资料状态
    status_labels:
      doc-sig-reviewed:          # 资料 SIG 已评审通过 → 不需要处理
        text: 资料已评审
        color: C6EFCE            # 绿
      need-doc-sig-review:       # 等待资料 SIG 评审 → 需要处理
        text: 待资料评审
        color: FFFF00            # 黄
    issue_title_prefix: '[资料]:'  # Issue 标题前缀
    issue_type: 资料               # 或 issue_type 为「资料」（与标题前缀取并集）
    # 收件人：含 @ 的条目直接当邮箱用；否则当 gitcode_id，从 sig-info.yaml 的邮箱映射取。
    # 这里统一直写邮箱，不依赖 sig-info 的邮箱映射（Doc SIG 的 sig-info 里赵聪邮箱是坏的，
    # 且邮箱映射只覆盖 SIG 成员，改动也不够可控）。
    receivers:
      - gengxueping@huawei.com     # 耿雪萍（Doc SIG maintainer）
      - weishengling@huawei.com    # 魏圣凌（Doc SIG maintainer）
      - qiuqian6@huawei.com        # 邱仟（Doc SIG committer）
      - weijinghan@huawei.com      # 魏婧涵（Doc SIG committer）
      - zhaocong2@huawei.com       # 赵聪（Doc SIG committer，gitcode_id: congzhaohw）
      # h-partners 侧
      - gongzhenan@h-partners.com
      - luoqingmei2@h-partners.com
      - weiyangchun5@h-partners.com
      - zhangshuyi25@h-partners.com
    nickname: BoostKit 资料管理员   # 邮件开头的称呼（收件人不都是资料负责人，用中性称呼）
    subject_pr: BoostKit 资料相关 PR 汇总
    body_pr: 以下是 BoostKit 社区所有涉及资料变更的待处理 PR，烦请及时跟进。
    subject_issue: BoostKit 资料相关 Issue 汇总
    body_issue: 以下是 BoostKit 社区所有资料相关的待处理 Issue，烦请及时跟进。
  # 社区全量汇总：社区级邮件（不按 reviewer 分发），发给 QA SIG 的固定收件人名单，
  # 由独立流水线 qa_statistics.py 处理（见 jenkins_job_boostkit_qa.sh）。
  # 与资料汇总不同，这里不做任何过滤：所有 SIG 的待处理 PR / Issue 全量汇总。
  qa_report:
    enabled: true
    workdir: boostkit-qa        # 独立运行目录，可与周报、资料汇总并行跑互不干扰
    # 成员变动自动适配：每次运行从 community/sig/QA/sig-info.yaml 读取当前 maintainer，
    # 换人/换邮箱无需改本文件（成员以 boostkit/community 的 sig/QA/sig-info.yaml 为准）。
    # receiver_roles 可加 'committer'（会取各仓库 committers），默认只看 maintainer。
    receivers_sig: QA
    receiver_roles:
      - maintainer
    # 额外固定收件人（可选，留空即可）：含 @ 直接当邮箱，否则按 gitcode_id 从 sig-info 邮箱映射查。
    # 注意：当前两位 maintainer 都是 163 个人邮箱，未认证 SMTP 发出的邮件容易被判为垃圾邮件，
    # 需提醒加白名单，或改用企业邮箱/邮件列表。
    receivers: []
    nickname: BoostKit QA SIG 负责人
    subject_pr: BoostKit 社区待处理 PR 汇总（全量）
    body_pr: 以下是 BoostKit 社区所有 SIG 的待处理 PR 汇总，按 SIG 分组，烦请及时跟进。
    subject_issue: BoostKit 社区待处理 Issue 汇总（全量）
    body_issue: 以下是 BoostKit 社区所有 SIG 的待处理 Issue 汇总，按 SIG 分组，烦请及时跟进。
